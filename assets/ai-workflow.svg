<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 372" width="920" role="img" aria-labelledby="t d">
<title id="t">AI-assisted engineering workflow</title>
<desc id="d">Eight stages: requirements, repository analysis, planning, implementation, review, tests, debugging, independent validation. Coding agents assist; judgment, testing and validation stay with the engineer.</desc>
<style>
.num{font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#58a6ff} .lb{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3} .sb{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
.hd{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;fill:#7d8590} .ft{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e} .ft b{fill:#e6edf3}
.n{animation:f .5s ease-out both} @keyframes f{from{opacity:0;transform:translateY(6px)}}
.fl{stroke-dasharray:5 5;animation:d 1.2s linear infinite} @keyframes d{to{stroke-dashoffset:-10}}
@media (prefers-reduced-motion:reduce){.n,.fl{animation:none}}
</style>
<rect x="0.5" y="0.5" width="919" height="371" rx="12" fill="#0d1117" stroke="#30363d"/>
<text class="hd" x="16" y="32">$ workflow --human-in-the-loop</text>
<path id="flow" d="M118 96H802V166H118V236H802" fill="none" stroke="#388bfd" stroke-opacity=".55" stroke-width="1.5" class="fl"/>
<g class="n" style="animation-delay:0.00s"><rect x="16" y="56" width="204" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="num" x="32" y="82">01</text><text class="lb" x="32" y="106">Requirements</text><text class="sb" x="32" y="123">scope &amp; unknowns</text></g>
<g class="n" style="animation-delay:0.15s"><rect x="244" y="56" width="204" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="num" x="260" y="82">02</text><text class="lb" x="260" y="106">Repo analysis</text><text class="sb" x="260" y="123">map code &amp; dependencies</text></g>
<g class="n" style="animation-delay:0.30s"><rect x="472" y="56" width="204" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="num" x="488" y="82">03</text><text class="lb" x="488" y="106">Planning</text><text class="sb" x="488" y="123">approach &amp; risks</text></g>
<g class="n" style="animation-delay:0.45s"><rect x="700" y="56" width="204" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="num" x="716" y="82">04</text><text class="lb" x="716" y="106">Implementation</text><text class="sb" x="716" y="123">code &amp; refactoring</text></g>
<g class="n" style="animation-delay:0.60s"><rect x="16" y="196" width="204" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="num" x="32" y="222">05</text><text class="lb" x="32" y="246">Review</text><text class="sb" x="32" y="263">read the diff critically</text></g>
<g class="n" style="animation-delay:0.75s"><rect x="244" y="196" width="204" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="num" x="260" y="222">06</text><text class="lb" x="260" y="246">Tests</text><text class="sb" x="260" y="263">integration &amp; contract</text></g>
<g class="n" style="animation-delay:0.90s"><rect x="472" y="196" width="204" height="80" rx="10" fill="#161b22" stroke="#30363d"/>
<text class="num" x="488" y="222">07</text><text class="lb" x="488" y="246">Debugging</text><text class="sb" x="488" y="263">trace to root cause</text></g>
<g class="n" style="animation-delay:1.05s"><rect x="700" y="196" width="204" height="80" rx="10" fill="#161b22" stroke="#3fb950"/>
<text class="num" x="716" y="222">08</text><text class="lb" x="716" y="246">Validation</text><text class="sb" x="716" y="263">independent, end-to-end</text></g>
<circle r="4.5" fill="#58a6ff"><animateMotion dur="9s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#flow"/></animateMotion></circle>
<line x1="16" x2="904" y1="306" y2="306" stroke="#21262d"/>
<text class="ft" x="16" y="332">Assisted by <tspan class="hd" fill="#e6edf3">Claude Code · Codex · OpenCode · DeepSeek</tspan></text>
<text class="ft" x="16" y="352">Agents accelerate analysis. Judgment, testing and validation stay with me.</text>
</svg>
