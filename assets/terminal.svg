<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 442" width="860" role="img" aria-labelledby="t d">
<title id="t">Terminal card: whoami</title>
<desc id="d">Specialist Backend Developer focused on backend, distributed systems and cloud. C# and .NET, REST APIs, microservices, AWS, Docker, CI/CD. B.Sc. Actuarial Science. Based in Mérida, Mexico.</desc>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:15px}
.k{fill:#7d8590} .a{fill:#484f58} .v{fill:#e6edf3}
.p{fill:#3fb950;font-weight:600} .pp{fill:#58a6ff;font-weight:600} .c{fill:#e6edf3}
.ttl{fill:#7d8590;font-size:13px}
.row{animation:f .45s ease-out both}
@keyframes f{from{opacity:0;transform:translateX(-8px)}}
.ty{animation:ty .7s steps(6,end) .4s both}
@keyframes ty{from{width:0}}
.p2{animation:f .3s ease-out 3.46s both}
.cur{fill:#e6edf3;animation:f .01s 3.46s both,b 1.1s steps(1) 3.76s infinite}
@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.row,.ty,.p2,.cur{animation:none}}
</style>
<defs><clipPath id="cp"><rect class="ty" x="190" y="60" width="54" height="30"/></clipPath></defs>
<rect x="0.5" y="0.5" width="859" height="441" rx="12" fill="#0d1117" stroke="#30363d"/>
<path d="M1 40h858V12.5A11.5 11.5 0 0 0 847.5 1h-835A11.5 11.5 0 0 0 1 12.5z" fill="#161b22"/>
