<circle cx="26" cy="21" r="6" fill="#ff5f56"/><circle cx="48" cy="21" r="6" fill="#ffbd2e"/><circle cx="70" cy="21" r="6" fill="#27c93f"/>
<text class="ttl" x="430" y="25" text-anchor="middle">jesus@github: ~</text>
<text x="40" y="88"><tspan class="p">jesus</tspan><tspan class="c">@</tspan><tspan class="pp">github</tspan><tspan class="c">:~$</tspan></text>
<text class="c" x="190" y="88" textLength="54" lengthAdjust="spacing" clip-path="url(#cp)">whoami</text>
